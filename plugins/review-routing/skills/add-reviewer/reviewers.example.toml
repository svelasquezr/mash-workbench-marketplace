# .claude/reviewers.toml: which reviewer agents review which paths of this project.
#
# The review-changes skill reads this file and asks git which changed files each rule claims,
# so every match is made by git itself, the same way every time. The add-reviewer skill writes
# and checks it.
#
# Paths are git glob pathspecs, relative to the repository root:
#   'src/payments'           the folder and everything under it
#   'src/payments/*.py'      .py files directly in that folder (* stops at a /)
#   'tests/**/test_charge*'  ** crosses folders
#   '*.md'                   Markdown files at the top level only
#   ':!docs/archive'         inside a list: leave these paths out of this rule
# Write every value in single quotes ('...'): review-changes refuses a value that contains a
# single quote or a line break, or that starts with - or with : (only :! is allowed).
#
# Top-level keys come first: TOML puts every key after a [[table]] header into that table.

# Required: the format of this file. Version 1 files (regex patterns) are for review-routing 0.3;
# the add-reviewer skill's "Migrating from 0.3" converts them.
version = 2

# Optional: who reviews a changed path that no route claims. Default: this plugin's read-only
# change-reviewer. It must be a read-only reviewer agent: "general-purpose" is refused.
# default_reviewer = "review-routing:change-reviewer"

# Optional: the model the default reviewer runs on here: sonnet, opus or fable (never haiku).
# Without it, the agent file's own model applies.
# default_model = "opus"

# Optional: the tracked paths that may get only the default reviewer, each with a reason. With
# it, the check fails when a tracked file falls through to the default without being listed, so
# a new module can't silently miss its specialist. Without it, the check skips that test.
allow_default = [
  { paths = ['src/app'], reason = "application glue: a general review is enough" },
  { paths = ['package.json', 'package-lock.json'], reason = "dependency bumps; the payments SDK has its own rule below" },
  { paths = ['.claude'], reason = "agent tooling" },
]

# A changed path gets every reviewer whose route claims it; one route may name several reviewers.
# List a module's tests next to its code, so a test change reaches the same reviewer.
# `reason` (optional) is shown in the review-changes preview table.
[[routes]]
paths = ['src/payments', 'tests/payments']
reviewers = ["payments-reviewer"]
reason = "moves money"

[[routes]]
paths = ['migrations']
reviewers = ["database-reviewer"]

[[routes]]
paths = ['docs', '*.md', ':!docs/archive']
reviewers = ["docs-reviewer"]
reason = "user-facing docs; the archive is history"

# A changed line (added or removed) that matches line_regex, in a file the paths claim, adds the
# reviewers: bumping the payments SDK changes how money moves. line_regex is a POSIX extended
# regex (git diff -G): no \d, no lookahead; ^ anchors at the line's content.
# ignore_case = true matches upper and lower case alike.
[[changed_lines]]
paths = ['package.json', 'package-lock.json']
line_regex = 'payments-sdk'
ignore_case = true
reviewers = ["payments-reviewer"]
reason = "the SDK moves money"

# Optional: a stronger model for one reviewer when a change is risky. Every condition given must
# hold: commit_regex (POSIX extended) matches one of the change's commit subjects; paths claims a
# changed file; min_added_lines (needs paths) lines or more were added under those paths. The
# first matching rule wins; without one, default_model applies (default reviewer only), else the
# agent file's model.
# Sizing policy: reviewers run on Sonnet by default (their agent file); Opus for substantial logic;
# Fable for design, or for the area where one miss is most expensive. Never Haiku.
# [[model_rules]]
# reviewer = "payments-reviewer"
# model = "fable"
# commit_regex = '^feat'
# paths = ['src/payments']
# min_added_lines = 40
# reason = "new payment code: a design review where one miss moves money"

# [[model_rules]]
# reviewer = "database-reviewer"
# model = "opus"
# paths = ['migrations']
# min_added_lines = 150
# reason = "150+ migration lines in one change is substantial logic"

# Routing test cases for the check: the exact set of reviewers each path gets. One per route,
# plus near misses it must not claim. A path does not have to exist yet.
[[expect]]
path = "src/payments/charge.py"
reviewers = ["payments-reviewer"]

[[expect]]
path = "tests/payments/test_charge_refunds.py"
reviewers = ["payments-reviewer"]

[[expect]]
path = "src/app/payments_page.py" # near miss: the app's payments page is not the payments code
reviewers = ["review-routing:change-reviewer"]

[[expect]]
path = "migrations/0002_add_index.sql"
reviewers = ["database-reviewer"]

[[expect]]
path = "README.md"
reviewers = ["docs-reviewer"]

[[expect]]
path = "docs/archive/2019.md" # near miss: excluded from the docs route
reviewers = ["review-routing:change-reviewer"]
