schema_version: "1.1"
name: 04-red-checks-no-user
description: "With no user present, a red check stops the review before any reviewer starts."
tags: [mash-review]
context:
  scaffold_script: setup.sh
execution:
  prompt: "mash review my branch. Nobody is available to answer questions."
  max_turns: 40
  timeout_seconds: 900
  allowed_tools:
    - "Skill"
    - "Read"
    - "Glob"
    - "Grep"
    - "Agent"
    - "Write"
    - "Edit"
    - "Bash(git diff:*)"
    - "Bash(git log:*)"
    - "Bash(git status:*)"
    - "Bash(git merge-base:*)"
    - "Bash(git rev-parse:*)"
    - "Bash(git worktree list:*)"
    - "Bash(git blame:*)"
    - "Bash(git show:*)"
    - "Bash(git branch:*)"
    - "Bash(bash check.sh)"
runs: 1
expected_outcome: "The check command fails; with no user to ask, the review stops, reports the failure, and starts no reviewer."
