schema_version: "1.1"
name: 05-escape-no-user
description: "With no user present, an escape is not written; the final report lists it for confirmation."
tags: [mash-review]
context:
  scaffold_script: setup.sh
execution:
  prompt: "A review comment on https://github.com/acme/shop/pull/7 says that total() in src/billing.py adds the discount instead of subtracting it. That code is on main, and its review ended SAFE TO LAND. Record this review escape. Nobody is available to answer questions."
  max_turns: 40
  timeout_seconds: 900
  allowed_tools:
    - "Skill"
    - "Read"
    - "Glob"
    - "Grep"
    - "Agent"
    - "Write"
    - "Edit"
    - "Bash(git diff:*)"
    - "Bash(git log:*)"
    - "Bash(git status:*)"
    - "Bash(git merge-base:*)"
    - "Bash(git rev-parse:*)"
    - "Bash(git worktree list:*)"
    - "Bash(git blame:*)"
    - "Bash(git show:*)"
    - "Bash(git branch:*)"
runs: 1
expected_outcome: 'Nothing is written; the final report holds an "Escapes to record (confirm where):" block with the escape, its source link and a proposed place.'
