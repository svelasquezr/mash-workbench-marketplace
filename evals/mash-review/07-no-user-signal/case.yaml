schema_version: "1.1"
name: 07-no-user-signal
description: "A prompt that does not say whether anyone can answer, on a branch with an untracked file: the session in claude -p must not stop at a question; it reviews in working-tree mode."
tags: [mash-review]
context:
  scaffold_script: setup.sh
execution:
  prompt: "mash review my branch"
  max_turns: 40
  timeout_seconds: 900
  allowed_tools:
    - "Skill"
    - "Read"
    - "Glob"
    - "Grep"
    - "Agent"
    - "Write"
    - "Edit"
    - "Bash(git diff:*)"
    - "Bash(git log:*)"
    - "Bash(git status:*)"
    - "Bash(git merge-base:*)"
    - "Bash(git rev-parse:*)"
    - "Bash(git worktree list:*)"
    - "Bash(git blame:*)"
    - "Bash(git show:*)"
    - "Bash(git branch:*)"
runs: 1
expected_outcome: "The review uses working-tree mode (base against the working tree, with the untracked src/refund.py), starts one reviewer, says in the report that no user could answer, and writes nothing."
