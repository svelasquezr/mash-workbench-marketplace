schema_version: "1.1"
name: 09-model-from-request
description: "A model named in the request wins over the opus default."
tags: [mash-review]
context:
  scaffold_script: setup.sh
execution:
  prompt: "mash review my branch with sonnet. Nobody is available to answer questions."
  max_turns: 40
  timeout_seconds: 900
  allowed_tools:
    - "Skill"
    - "Read"
    - "Glob"
    - "Grep"
    - "Agent"
    - "Write"
    - "Edit"
    - "Bash(git diff:*)"
    - "Bash(git log:*)"
    - "Bash(git status:*)"
    - "Bash(git merge-base:*)"
    - "Bash(git rev-parse:*)"
    - "Bash(git worktree list:*)"
    - "Bash(git blame:*)"
    - "Bash(git show:*)"
    - "Bash(git branch:*)"
runs: 1
expected_outcome: "One mash-review:reviewer runs on sonnet because the request names sonnet, and the summary says so."
