schema_version: "1.1"
name: 06-scout-old-default
description: "With only the 0.x default backlog docs/mash/tooling-backlog.md, scout writes nothing, starts no second backlog, and points to migrate."
tags: [mash-workbench]
context:
  scaffold_script: setup.sh
execution:
  prompt: "I keep regenerating the API client by hand after every schema change: three commands each time, and I forgot one step twice this week. Note this as a tooling candidate; do not build it. Nobody is available to answer questions."
  max_turns: 30
  timeout_seconds: 600
  allowed_tools:
    - "Skill"
    - "Read"
    - "Glob"
    - "Grep"
    - "Write"
    - "Edit"
    - "Bash(git diff:*)"
    - "Bash(git log:*)"
    - "Bash(git status:*)"
    - "Bash(git rev-parse:*)"
    - "Bash(git worktree list:*)"
    - "Bash(git show:*)"
runs: 1
expected_outcome: "Nothing is written; the final report lists the candidate and says to run /mash-workbench:migrate."
