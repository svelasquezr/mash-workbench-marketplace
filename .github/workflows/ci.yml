name: ci
on:
  pull_request:
  push:
    branches: [main]  # branch pushes are covered by their pull request; avoids a duplicate run
permissions:
  contents: read  # the job only checks out and tests; it writes nothing back
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0  # full history, so commit messages in the pushed range can be checked
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
      # `claude plugin validate` needs no login; check.sh requires it when CI is set.
      - run: npm install -g @anthropic-ai/claude-code@2.1.289
      - run: bash scripts/check.sh
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.12.23"
      - name: Check commit messages (Conventional Commits)
        env:
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -n "$PR_BASE" ]; then
            range="$PR_BASE..$HEAD_SHA"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
              && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..$HEAD_SHA"
          elif git rev-parse --verify -q "$HEAD_SHA~1" > /dev/null; then
            range="$HEAD_SHA~1..$HEAD_SHA"  # new branch or force-push: check the head commit
          else
            range="$HEAD_SHA"  # the repository's first commit has no parent
          fi
          echo "checking $range"
          uvx --from commitizen==4.19.3 cz check --rev-range "$range"
      - run: uvx pre-commit@4.6.2 run --all-files --show-diff-on-failure
